name: Validate directory

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog
        run: npx --yes ajv-cli@5 validate --spec=draft2020 -s schema.json -d extensions.json
      - name: Check ordering and uniqueness
        run: node scripts/check-directory.js
      - name: Check generated extension pages
        run: |
          node scripts/generate-pages.js
          git diff --exit-code -- extensions/
