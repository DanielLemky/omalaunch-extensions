name: Validate directory

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm ci
      - name: Validate catalog
        run: npm run check
      - name: Validate listed repositories
        run: npm run check:repositories
      - name: Check generated extension pages
        run: |
          node scripts/generate-pages.js
          git diff --exit-code -- extensions/
